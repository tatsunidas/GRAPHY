site_name: GRAPHY ユーザーマニュアル
site_url: https://tatsunidas.github.io/GRAPHY/
repo_url: https://github.com/tatsunidas/GRAPHY
repo_name: tatsunidas/GRAPHY
site_author: Tatsuaki Kobayashi
site_description: GRAPHY オープンソース DICOM ビューワ ユーザーマニュアル

nav:
  - はじめに: index.md
  - データベース: database.md
  - 入出力データ: io.md
  - データベースウィンドウ（MainScreen）: main-screen.md
  - 2Dビューワ: viewer2d.md
  - 3Dビューワ: viewer3d.md
  - MPRウィンドウ: mpr.md
  - Slicerウィンドウ: slicer.md
  - Radiomics特徴計算機能: radiomics.md
  - 環境設定: settings.md

theme:
  name: material
  language: ja
  logo: images/logo.png
  favicon: images/logo.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: このページの目次

plugins:
  - search:
      lang: ja
  - with-pdf:
      author: Tatsuaki Kobayashi
      copyright: "Copyright &copy; 2024 Vis-ionary, Inc. | Mozilla Public License 2.0"
      cover: true
      cover_title: GRAPHY ユーザーマニュアル
      cover_subtitle: オープンソース DICOM ビューワ
      toc_title: 目次
      heading_shift: false
      toc_level: 3
      ordered_chapter_level: 2
      output_path: pdf/graphy-manual.pdf
      enabled_if_env: ENABLE_PDF_EXPORT
      custom_template_path: docs/pdf_template

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tatsunidas/GRAPHY
  version:
    provider: mike
